<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AquaMark App Icon Generator</title>
<style>
body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #111; gap: 20px; font-family: -apple-system, sans-serif; color: #fff; }
canvas { border-radius: 220px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
button { padding: 12px 32px; font-size: 16px; font-weight: 700; border: none; border-radius: 12px; background: linear-gradient(135deg, #7C3AED, #A78BFA); color: #fff; cursor: pointer; }
p { color: #888; font-size: 14px; }
</style>
</head>
<body>
<h2>AquaMark App Icon</h2>
<canvas id="icon" width="1024" height="1024"></canvas>
<button onclick="download()">Download 1024×1024 PNG</button>
<p>Save this as AppIcon.png and add to Assets.xcassets/AppIcon.appiconset/</p>

<script>
const canvas = document.getElementById('icon');
const ctx = canvas.getContext('2d');
const W = 1024, H = 1024;

function draw() {
  // Background gradient
  const bg = ctx.createRadialGradient(W*0.3, H*0.25, 0, W*0.5, H*0.5, W*0.7);
  bg.addColorStop(0, '#2D1B69');
  bg.addColorStop(0.4, '#1A103D');
  bg.addColorStop(0.7, '#0E0A24');
  bg.addColorStop(1, '#080614');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Glow behind drop
  const glow = ctx.createRadialGradient(W*0.5, H*0.42, 0, W*0.5, H*0.42, W*0.35);
  glow.addColorStop(0, 'rgba(139,124,246,0.3)');
  glow.addColorStop(0.5, 'rgba(124,58,237,0.15)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Secondary glow
  const glow2 = ctx.createRadialGradient(W*0.6, H*0.55, 0, W*0.5, H*0.5, W*0.3);
  glow2.addColorStop(0, 'rgba(244,114,182,0.1)');
  glow2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow2;
  ctx.fillRect(0, 0, W, H);

  // Water drop shape
  ctx.save();
  ctx.translate(W*0.5, H*0.46);
  const scale = 2.8;

  ctx.beginPath();
  const dropPath = new Path2D();
  // Teardrop shape
  const r = 85 * scale;
  const tipY = -130 * scale;
  const botY = 60 * scale;
  
  ctx.beginPath();
  ctx.moveTo(0, tipY);
  ctx.bezierCurveTo(r*0.15, tipY + r*0.6, r, botY - r*0.3, r*0.85, botY + r*0.1);
  ctx.bezierCurveTo(r*0.7, botY + r*0.45, r*0.35, botY + r*0.58, 0, botY + r*0.6);
  ctx.bezierCurveTo(-r*0.35, botY + r*0.58, -r*0.7, botY + r*0.45, -r*0.85, botY + r*0.1);
  ctx.bezierCurveTo(-r, botY - r*0.3, -r*0.15, tipY + r*0.6, 0, tipY);
  ctx.closePath();

  // Drop gradient fill
  const dropGrad = ctx.createLinearGradient(-r, tipY, r, botY + r*0.6);
  dropGrad.addColorStop(0, '#A78BFA');
  dropGrad.addColorStop(0.3, '#8B7CF6');
  dropGrad.addColorStop(0.6, '#7C3AED');
  dropGrad.addColorStop(1, '#6D28D9');
  ctx.fillStyle = dropGrad;
  ctx.fill();

  // Inner highlight
  ctx.save();
  ctx.clip();
  const highlight = ctx.createRadialGradient(-r*0.2, tipY + r*0.5, 0, 0, botY*0.3, r*1.2);
  highlight.addColorStop(0, 'rgba(255,255,255,0.2)');
  highlight.addColorStop(0.3, 'rgba(255,255,255,0.05)');
  highlight.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = highlight;
  ctx.fillRect(-r*1.5, tipY - r, r*3, (botY + r*0.6 - tipY) + r*2);
  ctx.restore();

  // Small reflection dot
  ctx.beginPath();
  ctx.ellipse(-r*0.25, tipY + r*0.9, r*0.12, r*0.15, -0.3, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fill();

  ctx.restore();

  // "AquaMark" text at bottom
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = '700 52px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.letterSpacing = '2px';
  ctx.fillText('AquaMark', W*0.5, H*0.88);

  // Subtle border ring
  ctx.strokeStyle = 'rgba(139,124,246,0.08)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(16, 16, W-32, H-32, 210);
  ctx.stroke();
}

draw();

function download() {
  const link = document.createElement('a');
  link.download = 'AppIcon.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>

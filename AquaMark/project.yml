name: SaveBox
options:
  bundleIdPrefix: com.savebox
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SaveBox:
    type: application
    platform: iOS
    sources:
      - SaveBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.savebox.app
        INFOPLIST_FILE: SaveBox/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
